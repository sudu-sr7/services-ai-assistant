<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Services AI Assistant
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <div class="container">

    <h1>
      Services AI Assistant
    </h1>

    <div class="combo-box">

      <input
        type="text"
        id="serviceSearch"
        placeholder="Search Government Service..."
        autocomplete="off"
      >

      <div
        id="dropdownIcon"
        class="dropdown-icon"
      >
        ▼
      </div>

      <div
        id="suggestions"
        class="suggestions"
      ></div>

    </div>

    <textarea
      id="message"
      readonly
      placeholder="Welcome! Please select the service you need assistance with, and I'll guide you through the next steps."
    ></textarea>

    <button
      id="askBtn"
      onclick="sendMessage()"
      disabled
    >
      Ask
    </button>

    <div id="response"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script src="app.js"></script>

</body>

</html>
